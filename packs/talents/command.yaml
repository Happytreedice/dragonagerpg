  degrees:
    novice: "<p>Your presence inspires your allies. If you spend a major action on a heroic gesture, such as raising your sword, shouting a battle cry or waving a banner, all your allies gain +1 on [[/test wil focus=Courage]] tests for the rest of the encounter.</p>"
