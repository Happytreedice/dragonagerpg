    value: "<p>You touch a target and make them forget, or recall, a particular memory. You can erase the memory of an event that happened no more than a number of hours ago equal to your Magic, but you can restore a memory of any age, provided it is of something that truly happened.</p><p>A target resists losing a memory with a [[/test wil focus=Self-Discipline]] test vs. your Spellpower; restoring a lost memory calls for no test.</p>"
