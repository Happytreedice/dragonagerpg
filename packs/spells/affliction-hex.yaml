    value: "<p>You curse one visible target within 30 yards and every other enemy within 10 yards of it. Until the end of the encounter, all of them suffer -2 on tests to resist Spellpower.</p><p>If the primary target passes a [[/test mag focus=Entropy]] test vs. your Spellpower, its own penalty drops to -1 and the hex is lifted from all secondary targets. Secondary targets may test for themselves, but a success helps only the character who rolled it.</p>"
