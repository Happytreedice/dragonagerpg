  description:
    value: "<p>A slick pool of grease up to 10 yards across appears anywhere within 30 yards. Anyone in the area when you cast the spell, or who enters or moves within it, must pass a [[/test dex focus=Acrobatics]] test vs. your Spellpower or fall prone; prone characters can still crawl normally.</p><p>The grease is flammable. Any contact with fire ignites it, dealing [[/damage 1d6 penetrating]]{1d6} penetrating damage at once to everyone in the area; the fire then burns for a number of rounds equal to your Magic, dealing [[/damage 1d6 penetrating]]{1d6} penetrating damage each turn to everyone inside.</p>"
