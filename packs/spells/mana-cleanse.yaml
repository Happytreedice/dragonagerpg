  description:
    value: "<p>You turn your own mana against other spellcasters. Until the end of the encounter, whenever anyone spends mana within 16 yards of you, you can spend the same number of mana points to cancel that spell; for example, 4 MP to negate a 4 MP casting. If you cannot pay the full amount, the counterspell fails.</p><p>You learn only how many mana points the other caster is spending, not which spell they are casting.</p>"
