    value: "<p>A small thunderstorm with a 4-yard radius breaks out at any point within 40 yards. Lightning strikes everyone in the area for [[/damage 2d6+@abilities.magic.value penetrating]]{2d6 + Magic} penetrating damage, or only [[/damage 1d6 penetrating]]{1d6} penetrating damage with a successful [[/test con focus=Stamina]] test vs. your Spellpower.</p><p>The tempest lasts one round. You can extend it by one round at a time by paying 10 MP as a free action at the start of each of your following turns. Each time you do, everyone in the area suffers its effects again at once.</p>"
