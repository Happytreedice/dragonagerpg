    value: "<p>A glyph traced on the ground with your hand or staff raises a faintly shimmering dome up to 6 yards across and 3 yards high at the center. Whatever the weather outside, the air within stays cool, dry and comfortable: rain, snow and small debris are kept out, yet fresh air flows in and smoke, such as from a campfire, escapes.</p><p>You can set the light inside anywhere from shadowy to as bright as a lantern. The dome is completely useless in combat.</p>"
